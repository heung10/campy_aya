# One-camera W154 config with Pulse Pal software-started external trigger
# and integrated Neurologger GPIO timestamp logging.
# Command:
#   campy-acquire ./configs/W154_WT/campy_config_W154_WT_1camera_gpio.yaml

# Recording parameters
saveFolder: "../campy_test/GPIO_test/06222026"

videoFilename: "0.mp4"
frameRate: 40
recTimeInSec: 10000
infiniteRecording: True

# Camera parameters
numCams: 1
cameraSelection: [0]
cameraNames: ["Camera1"]
cameraMake: "basler"
cameraSerialNo: ["24188010"]
cameraSettings:
  - "./configs/W154_WT/acA1300-200uc_24188010.pfs"
frameWidth: 1280
frameHeight: 1024
cameraTrigger: "Line3"
cameraDebug: True
grabTimeoutInMs: 1000
bufferSize: 500

# Compression parameters
gpuID: [0]
ffmpegPath: "C:/Users/Cornell/anaconda3/envs/campy/Library/bin/ffmpeg.exe"
gpuMake: "nvidia"
preset: "None"
pixelFormatInput: "gray"
pixelFormatOutput: "yuv420p"
codec: "h264"
quality: 17
ffmpegLogLevel: "warning"

# Display parameters
chunkLengthInSec: 5
displayFrameRate: 15
displayDownsample: 2

# Trigger parameters
startArduino: False
startTriggerController: True
triggerController: "pulsepal"
waitForTriggerStart: True

# Pulse Pal parameters
pulsePalPythonPath: "C:/Users/Cornell/Downloads/PulsePal-master/PulsePal-master/Python/Python3"
pulsePalPort: "COM10"
pulsePalChannels: [1, 2]
pulseFrequencyHz: 40
pulseHighTimeSec: 0.005
pulseTrainDurationSec: 1800
pulsePalContinuous: True
pulsePalVoltage: 5
pulsePalRestingVoltage: 0
pulsePalTriggerChannel: 1

# Neurologger GPIO timestamp logging
enableGPIOTimestampLogging: True
gpioSerialPort: "COM6"
gpioBaudRate: 119200
gpioLogFilename: "gpio_log.csv"

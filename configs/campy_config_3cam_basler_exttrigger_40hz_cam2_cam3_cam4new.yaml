# Three-camera validation config for Basler GigE external-trigger testing.
# Uses cam2, cam3, and cam4 with the new Ethernet-board-specific PFS.

# Recording parameters
videoFolder: "./test_3cam_basler_exttrigger_40hz_cam2_cam3_cam4new"
videoFilename: "0.mp4"
frameRate: 40
recTimeInSec: 600

# Camera parameters
numCams: 3
cameraSelection: [0,1,2]
cameraNames: ["Camera1","Camera2","Camera3"]
cameraMake: "basler"
cameraSerialNo: ["40356999","40676951","40325885"]
cameraSettings:
  - "./configs/cam2_a2A1920-51gmPRO_40356999.pfs"
  - "./configs/cam3_a2A1920-51gmPRO_40676951.pfs"
  - "./configs/cam4_new_a2A1920-51gmPRO_40325885.pfs"
frameWidth: 1920
frameHeight: 1200
cameraDebug: True
grabTimeoutInMs: 1000
bufferSize: 500

# Compression parameters
gpuID: [-1,-1,-1]
pixelFormatInput: "gray"
pixelFormatOutput: "yuv420p"
codec: "h264"
quality: 17
ffmpegLogLevel: "warning"

# Display parameters
chunkLengthInSec: 5
displayFrameRate: 0
displayDownsample: 2

# Trigger parameters
cameraTrigger: "Line2"
startArduino: False

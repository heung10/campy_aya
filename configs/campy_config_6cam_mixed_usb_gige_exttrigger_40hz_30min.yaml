# Six-camera mixed Basler USB + GigE config for external-trigger testing.
# Uses four a2A1920-160umBAS USB cameras and two a2A1920-51gmPRO GigE cameras.

# Recording parameters
videoFolder: "../campy_test/test_6cam_mixed_usb_gige_exttrigger_40hz_30min"
videoFilename: "0.mp4"
frameRate: 40
recTimeInSec: 1800

# Camera parameters
numCams: 6
cameraSelection: [0,1,2,3,4,5]
cameraNames: ["Camera1","Camera2","Camera3","Camera4","Camera5","Camera6"]
cameraMake: "basler"
cameraSerialNo: ["41927054","41927056","41927057","41927059","40356999","40482786"]
cameraSettings:
  - "./configs/a2A1920-160umBAS_41927054.pfs"
  - "./configs/a2A1920-160umBAS_41927056.pfs"
  - "./configs/a2A1920-160umBAS_41927057.pfs"
  - "./configs/a2A1920-160umBAS_41927059.pfs"
  - "./configs/a2A1920-51gmPRO_40356999_6cam.pfs"
  - "./configs/a2A1920-51gmPRO_40482786_6cam.pfs"
frameWidth: 1920
frameHeight: 1200
cameraTrigger: "Line2"
cameraDebug: True
grabTimeoutInMs: 1000
bufferSize: 500

# Compression parameters
gpuID: [-1,-1,-1,-1,-1,-1]
pixelFormatInput: "gray"
pixelFormatOutput: "yuv420p"
codec: "h264"
quality: 17
ffmpegLogLevel: "warning"

# Display parameters
chunkLengthInSec: 5
displayFrameRate: 20
displayDownsample: 2

# Trigger parameters
startArduino: False

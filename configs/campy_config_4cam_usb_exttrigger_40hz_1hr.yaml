# Four-camera long-run config for Basler USB external-trigger testing.
# Uses four a2A1920-160umBAS cameras at full resolution with 40 Hz trigger input.

# Recording parameters
videoFolder: "../campy_test/test_4cam_usb_exttrigger_40hz_1hr"
videoFilename: "0.mp4"
frameRate: 40
recTimeInSec: 3600

# Camera parameters
numCams: 4
cameraSelection: [0,1,2,3]
cameraNames: ["Camera1","Camera2","Camera3","Camera4"]
cameraMake: "basler"
cameraSerialNo: ["41927054","41927056","41927057","41927059"]
cameraSettings:
  - "./configs/a2A1920-160umBAS_41927054.pfs"
  - "./configs/a2A1920-160umBAS_41927056.pfs"
  - "./configs/a2A1920-160umBAS_41927057.pfs"
  - "./configs/a2A1920-160umBAS_41927059.pfs"
frameWidth: 1920
frameHeight: 1200
cameraTrigger: "Line2"
cameraDebug: True
grabTimeoutInMs: 1000
bufferSize: 500

# Compression parameters
gpuID: [-1,-1,-1,-1]
pixelFormatInput: "gray"
pixelFormatOutput: "yuv420p"
codec: "h264"
quality: 17
ffmpegLogLevel: "warning"

# Display parameters
chunkLengthInSec: 5
displayFrameRate: 20
displayDownsample: 2

# Trigger parameters
startArduino: False

# Three-camera validation config for mixed Basler GigE + USB external-trigger testing.
# Uses cam2, cam3, and acA640-90uc at their saved default/full resolutions.

# Recording parameters
videoFolder: "./test_3cam_mixed_basler_exttrigger_40hz"
videoFilename: "0.mp4"
frameRate: 40
recTimeInSec: 600

# Camera parameters
numCams: 3
cameraSelection: [0,1,2]
cameraNames: ["Camera1","Camera2","Camera3"]
cameraMake: "basler"
cameraSerialNo: ["40356999","40676951","24393400"]
cameraSettings:
  - "./configs/cam2_a2A1920-51gmPRO_40356999.pfs"
  - "./configs/cam3_a2A1920-51gmPRO_40676951.pfs"
  - "./configs/acA640-90uc_24393400.pfs"
frameWidth: [1920,1920,658]
frameHeight: [1200,1200,492]
cameraDebug: True
grabTimeoutInMs: 1000
bufferSize: 500

# Compression parameters
gpuID: [-1,-1,-1]
pixelFormatInput: "gray"
pixelFormatOutput: "yuv420p"
codec: "h264"
quality: 17
ffmpegLogLevel: "warning"

# Display parameters
chunkLengthInSec: 5
displayFrameRate: 0
displayDownsample: 2

# Trigger parameters
cameraTrigger: "Line2"
startArduino: False

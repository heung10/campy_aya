# Four-camera validation config for Basler GigE external-trigger testing.
# This is the next step after the 1-camera test succeeds.

# Recording parameters
videoFolder: "./test_4cam_basler_30hz"
videoFilename: "0.mp4"
frameRate: 30
recTimeInSec: 600

# Camera parameters
numCams: 4
cameraSelection: [0,1,2,3]
cameraNames: ["Camera1","Camera2","Camera3","Camera4"]
cameraMake: "basler"
cameraSerialNo: ["40356999","40676951","40325885","40482786"]
cameraSettings:
  - "./configs/cam2_a2A1920-51gmPRO_40356999.pfs"
  - "./configs/cam3_a2A1920-51gmPRO_40676951.pfs"
  - "./configs/cam4_a2A1920-51gmPRO_40325885.pfs"
  - "./configs/cam7_a2A1920-51gmPRO_40482786.pfs"
frameWidth: 1920
frameHeight: 1200
cameraDebug: True
grabTimeoutInMs: 1000
bufferSize: 500

# Compression parameters
gpuID: [-1,-1,-1,-1]
pixelFormatInput: "gray"
pixelFormatOutput: "yuv420p"
codec: "h264"
quality: 17
ffmpegLogLevel: "warning"

# Display parameters
chunkLengthInSec: 5
displayFrameRate: 0
displayDownsample: 2

# Trigger parameters
cameraTrigger: "Line2"
startArduino: False

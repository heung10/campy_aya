# Four-camera mixed Basler GigE + USB validation config.
# Uses cam2, cam3, one USB camera on external trigger, and one USB camera free-running at 40 Hz.

# Recording parameters
videoFolder: "./test_4cam_mixed_basler_2gige_2usb_40hz"
videoFilename: "0.mp4"
frameRate: 40
recTimeInSec: 600

# Camera parameters
numCams: 4
cameraSelection: [0,1,2,3]
cameraNames: ["Camera1","Camera2","Camera3","Camera4"]
cameraMake: "basler"
cameraSerialNo: ["40356999","40676951","24393400","24708404"]
cameraSettings:
  - "./configs/cam2_a2A1920-51gmPRO_40356999.pfs"
  - "./configs/cam3_a2A1920-51gmPRO_40676951.pfs"
  - "./configs/acA640-90uc_24393400.pfs"
  - "./configs/acA1300-200uc_24708404.pfs"
frameWidth: [1920,1920,658,1280]
frameHeight: [1200,1200,492,1024]
cameraTrigger: ["Line2","Line2","Line2","Software"]
cameraDebug: True
grabTimeoutInMs: 1000
bufferSize: 500

# Compression parameters
gpuID: [-1,-1,-1,-1]
pixelFormatInput: "gray"
pixelFormatOutput: "yuv420p"
codec: "h264"
quality: 17
ffmpegLogLevel: "warning"

# Display parameters
chunkLengthInSec: 5
displayFrameRate: 0
displayDownsample: 2

# Trigger parameters
startArduino: False

# One-camera validation config for Basler GigE external-trigger testing.
# Intended as the safest first Campy test before scaling to 4 cameras.

# Recording parameters
videoFolder: "./test_1cam_basler_40hz"
videoFilename: "0.mp4"
frameRate: 40
recTimeInSec: 60

# Camera parameters
numCams: 1
cameraSelection: [0]
cameraNames: ["Camera1"]
cameraMake: "basler"
cameraSettings: "./configs/cam2_a2A1920-51gmPRO_40356999.pfs"
frameWidth: 1920
frameHeight: 1200
cameraDebug: True

# Compression parameters
gpuID: -1
pixelFormatInput: "gray"
pixelFormatOutput: "yuv420p"
codec: "h264"
quality: 17
ffmpegLogLevel: "warning"

# Display parameters
chunkLengthInSec: 5
displayFrameRate: 5
displayDownsample: 2

# Trigger parameters
cameraTrigger: "Line2"
startArduino: False
